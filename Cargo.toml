[workspace]
resolver = "3"
members = [
  "crates/app",
  "crates/accounting",
  "crates/benefits",
  "crates/domain",
  "crates/engine",
  "crates/platform",
  "crates/codex",
  "crates/desktop",
  "crates/provider",
  "crates/pricing",
  "crates/product",
  "crates/quota",
  "crates/query",
  "crates/runtime",
  "crates/state",
  "crates/store",
  "crates/git",
]

# The gate spends its time inside dependencies, not workspace code: bundled
# SQLite, sha2, zstd and age's scrypt work factor of 2^16 are all pathological
# at opt-level 0. Optimize those and leave workspace crates cheap to rebuild.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
age = { version = "=0.12.1", default-features = false }
anyhow = "=1.0.103"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
clap = { version = "=4.6.1", features = ["derive"] }
jiff = "=0.2.32"
libc = "=0.2.186"
libsqlite3-sys = { version = "=0.38.1", features = ["bundled"] }
memchr = "=2.8.3"
notify = "=8.2.0"
rusqlite = { version = "=0.40.1", features = ["backup", "bundled", "hooks", "limits"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"
slint = { version = "=1.17.1", default-features = false, features = ["accessibility", "backend-winit", "compat-1-2", "raw-window-handle-06", "renderer-skia", "std"] }
slint-build = "=1.17.1"
raw-window-handle = "=0.6.2"
tempfile = "=3.27.0"
thiserror = "=2.0.18"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
zstd = { version = "=0.13.3", default-features = false }
